# On a tag, publish @chloejs/core and make a GitHub release for it. The npm
# token is npm's OIDC, so nothing here is a stored secret: it needs a trusted
# publisher on npm. The release notes are the commits since the last tag.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest  # trusted publishing needs npm 11.5.1 or newer
      - run: npm install
      - run: npm run check
      - run: npm publish --provenance --access public
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
