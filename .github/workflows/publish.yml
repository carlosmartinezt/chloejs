# On a tag, publish @chloejs/core. The token is npm's OIDC,
# so nothing here is a stored secret: it needs a trusted publisher on npm.
name: publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run check
      - run: npm publish --provenance --access public
